name = "QEC"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["QEC"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
# `weak.linter.mathlibStandardSet = true` used to sit here.  It is mathlib's
# *internal* soft-linter profile (the `weak.` "says" mechanism), copied into this
# lakefile along with the rest of the mathlib-style preamble.  It accounted for
# 393 of this library's 756 build warnings, 340 of them `linter.flexible`, whose
# only remedies are "rewrite the proof around `suffices`" or a `set_option` on
# every single declaration.  It is dropped here so the fork matches the other
# three vendored libraries; the substantive linters it does NOT own --
# deprecated references, unused `simp` arguments, unused variables, `letI`/
# `haveI` style, unused/never-executed tactics -- stay enabled and are clean.
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "master-2026-08-21"

# Blueprint extraction (https://github.com/hanwenzhu/LeanArchitect). The
# v4.34.0-rc1 tag exists, so the blueprint target is enabled here. Its own pins
# (Cli af8bc067a4cc, batteries 36cc05ca2d0e) already match the global mathlib's
# transitive revs, so this adds no dependency conflict.
[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "819aa8e70f3d2800abf0629a29d7c35bfaafd682"

[[lean_lib]]
name = "QEC"

# Light import surface for memory-constrained environments; excludes the
# BivariateBicycle leaves, which need more than a 4-core container or a shared
# web-editor session has. Deliberately not in `defaultTargets` — `lake build`
# still means the full library. See `QECLight.lean`.
[[lean_lib]]
name = "QECLight"

# Blueprint annotations for the whole library (root module `QECBlueprint.lean`).
# Needs the LeanArchitect require above (`QECBlueprint.lean` imports `Architect`).
# Not in `defaultTargets`, so `lake build` stays the plain library build.
[[lean_lib]]
name = "QECBlueprint"

[[lean_lib]]
name = "Foundations"
srcDir = "QEC"

# Infoview widgets (root module `QECWidgets.lean`): Pauli support strips,
# commutation parity views, and friends, built on ProofWidgets (already a
# transitive dependency via mathlib — no new `require`). Deliberately NOT in
# `defaultTargets` (same policy as QECBlueprint): only this target imports
# ProofWidgets, and `lake build` stays the plain library build. Build with
# `lake build QECWidgets`; it is part of the pre-push checklist in CLAUDE.md.
[[lean_lib]]
name = "QECWidgets"

